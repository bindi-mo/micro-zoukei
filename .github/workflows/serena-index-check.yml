name: Serena index & check

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  serena-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install serena (if missing)
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "git+https://github.com/oraios/serena"

      - name: Restore serena cache
        uses: actions/cache@v5
        with:
          path: .serena
          key: ${{ runner.os }}-serena-${{ hashFiles('**/package.json','**/Cargo.toml') }}

      - name: Index project
        run: |
          python - <<'PY'
          import sys
          from importlib.metadata import entry_points
          eps = entry_points().select(group='console_scripts')
          for ep in eps:
              if ep.name == 'serena':
                  func = ep.load()
                  sys.argv = ['serena','project','index','.']
                  func()
                  break
          else:
              raise SystemExit('serena entry point not found')
          PY

      - name: Memories check
        run: |
          python - <<'PY'
          import sys
          from importlib.metadata import entry_points
          eps = entry_points().select(group='console_scripts')
          for ep in eps:
              if ep.name == 'serena':
                  func = ep.load()
                  sys.argv = ['serena','memories','check']
                  func()
                  break
          else:
              raise SystemExit('serena entry point not found')
          PY

      - name: Save serena cache
        if: always()
        uses: actions/cache@v5
        with:
          path: .serena
          key: ${{ runner.os }}-serena-${{ hashFiles('**/package.json','**/Cargo.toml') }}
