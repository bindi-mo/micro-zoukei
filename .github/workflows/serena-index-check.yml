name: Serena index & check

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  serena-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install serena (if missing)
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "git+https://github.com/oraios/serena"

      - name: Restore serena cache
        uses: actions/cache@v5
        with:
          path: .serena
          key: ${{ runner.os }}-serena-${{ hashFiles('**/package.json','**/Cargo.toml') }}

      - name: Index project
        run: python -m serena project index .

      - name: Memories check
        run: python -m serena memories check

      - name: Save serena cache
        if: always()
        uses: actions/cache@v5
        with:
          path: .serena
          key: ${{ runner.os }}-serena-${{ hashFiles('**/package.json','**/Cargo.toml') }}
